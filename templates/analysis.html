{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">
        Crime Analysis: {{ location }} 
        <small class="text-muted">({{ location_type|title }}, 2001-2012)</small>
        <span class="badge" style="background-color: {{ risk_color }}; color: white; font-size: 1rem; margin-left: 10px;">
            {{ risk_level }}
        </span>
    </h1>
    
    <div class="card">
        <!-- Add this inside your card-body or above it -->
        <div class="mb-3">
            <label for="chartTypeSelect" class="form-label">Select Chart Type:</label>
            <select id="chartTypeSelect" class="form-select" aria-label="Select Chart Type">
                <option value="bar" selected>Bar Chart</option>
                <option value="line">Line Chart</option>
                <option value="scatter">Scatter Plot</option>
                <option value="box">Box Plot</option>
                <option value="pie">Pie Chart</option>
            </select>
        </div>

        <div class="card-header bg-primary text-white">
            Yearly Crime Trends
        </div>
        <div class="card-body">
            <div id="trend-chart" style="height: 1000px;"></div>
        </div>
    </div>
    
    <div class="mt-3">
        <a href="/" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Search
        </a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.plot.ly/plotly-2.11.0.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const trendData = {{ trend_json|tojson|safe }};
        let baseData = trendData.data;
        let layout = trendData.layout;
        let chartDiv = document.getElementById('trend-chart');

        function updateChart(chartType) {
            let updatedData = baseData.map(trace => {
                return {
                    ...trace,
                    type: chartType === 'density' ? 'histogram' : chartType  // approximate density
                };
            });

            if (chartType === 'pie') {
                updatedData = [{
                    type: 'pie',
                    labels: baseData.map(trace => trace.name),
                    values: baseData.map(trace => trace.y[trace.y.length - 1]),
                    name: "Crime Composition"
                }];
            }

            Plotly.newPlot(chartDiv, updatedData, layout);
        }

        // Initial chart render
        updateChart('bar');

        // Dropdown change listener
        document.getElementById('chartTypeSelect').addEventListener('change', function(e) {
            const selectedType = e.target.value;
            updateChart(selectedType);
        });

        // Make chart responsive
        window.addEventListener('resize', function () {
            Plotly.Plots.resize(chartDiv);
        });
    });
</script>
{% endblock %}
